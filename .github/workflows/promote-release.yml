name: Promote validated portable release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Windows build run containing DocumentScanner-portable
        required: true
        type: string
      release_tag:
        description: Release tag, for example v1.2.1
        required: true
        type: string
      target_sha:
        description: Exact validated source commit for the tag
        required: true
        type: string
      acceptance_note:
        description: Optional sentence on manual acceptance, for example who tested what and when
        required: false
        type: string
        default: ""
      cleanup_actions_artifacts:
        description: Delete all Actions artifacts after the release assets are safe
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated portable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name DocumentScanner-portable --dir release-assets

      - name: Verify release files
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # The packages must be the build of this version: Publish.ps1 names them DocumentScanner-v<version>-<runtime>.zip.
          for runtime in win-x64 win-x86; do
            test -n "$(find release-assets -type f -name "DocumentScanner-${RELEASE_TAG}-${runtime}.zip")" || { echo "No DocumentScanner-${RELEASE_TAG}-${runtime}.zip in the artifact"; exit 1; }
          done
          test "$(find release-assets -type f -name '*.zip' | wc -l)" -ge 2
          test "$(find release-assets -type f -name '*.sha256' | wc -l)" -ge 2
          find release-assets -type f -name '*.sha256' -print0 | while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done

      - name: Create release and upload validated packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ACCEPTANCE_NOTE: ${{ inputs.acceptance_note }}
        run: |
          set -euo pipefail
          notes="DocumentScanner ${RELEASE_TAG#v} production release. Validated Windows portable packages from Actions run $SOURCE_RUN_ID, including win-x64, win-x86 and SHA-256 checksums. See docs/CHANGELOG.md for changes."
          if [ -n "$ACCEPTANCE_NOTE" ]; then notes="$notes $ACCEPTANCE_NOTE"; fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "DocumentScanner $RELEASE_TAG" --notes "$notes"
          fi
          find release-assets -type f \( -name '*.zip' -o -name '*.sha256' \) -print0 | xargs -0 gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Delete Actions artifacts after promotion
        if: inputs.cleanup_actions_artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
